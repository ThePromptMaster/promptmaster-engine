name: CI

# Runs on every pull request and on main. Vercel auto-deploy is not connected
# to this repo, so this is the only gate between a merge and a CLI deploy.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests, lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend tests
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Types
        working-directory: frontend
        run: npx tsc --noEmit -p .
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
        run: npm run build

  e2e:
    name: Browser E2E (local Supabase, scripted model)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase (applies every migration to an empty database)
        run: supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,mailpit
      - name: SQL tests (supabase/tests/*.sql against the migrated database)
        run: |
          for f in supabase/tests/*.sql; do
            echo "== $f"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f "$f"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend install
        working-directory: backend
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Export local Supabase credentials
        run: |
          supabase status -o env | sed -n 's/^\(API_URL\|ANON_KEY\|SERVICE_ROLE_KEY\|JWT_SECRET\)="\?\([^"]*\)"\?$/\1=\2/p' > sb.env
          echo "SUPABASE_URL=$(grep ^API_URL= sb.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(grep ^ANON_KEY= sb.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(grep ^SERVICE_ROLE_KEY= sb.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "SUPABASE_JWT_SECRET=$(grep ^JWT_SECRET= sb.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          rm sb.env

      - name: Playwright
        working-directory: frontend
        env:
          CI: "true"
          E2E_UVICORN: uvicorn
        run: npm run test:e2e

      - name: Upload recordings and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
